name: Android CI/CD Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً من واجهة GitHub

jobs:
  build:
    name: Build Android APK & Run Tests
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تثبيت JDK 17 المتوافق مع أحدث إصدارات Android Gradle Plugin و Compose
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. إعطاء صلاحية التشغيل لـ gradlew
      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      # 4. التحقق من سلامة Gradle Wrapper
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      # 5. تشغيل اختبارات الوحدة (Unit Tests)
      - name: Run Unit Tests
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew testDebugUnitTest --stacktrace
          else
            gradle testDebugUnitTest --stacktrace
          fi

      # 6. بناء ملف الـ APK التجريبي (Debug APK)
      - name: Build Android Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      # 7. رفع ملف الـ APK الناتج كـ Artifact لتتمكن من تحميله مباشرة من GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: waqt-organizer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
